name: Sports 803 autopost

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log planned posts without publishing to Buffer'
        required: false
        type: boolean
        default: true

concurrency:
  # Keep scheduled runs from replacing a manually requested run while it is pending.
  group: sport803-autopost-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

env:
  PYTHONUNBUFFERED: '1'
  GITHUB_PAGES_URL: https://sport803.github.io/Today/

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Refresh events and post to Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_FACEBOOK_CHANNEL_ID: ${{ secrets.BUFFER_FACEBOOK_CHANNEL_ID }}
          BUFFER_TWITTER_CHANNEL_ID: ${{ secrets.BUFFER_TWITTER_CHANNEL_ID }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: python scripts/autopost.py

      - name: Commit refreshed event page and delivery state
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f docs/index.html ]; then
            git add docs/index.html
          fi
          if [ -f .autopost-state.json ]; then
            git add .autopost-state.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh events and autopost state [skip ci]'
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
